<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | E.M.E.P</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ====== NAVBAR ====== -->
<nav class="navbar" id="navbar">
  <div class="nav-left">
    <img src="./img/logo.png" alt="E.M.E.P Logo" class="nav-logo" onerror="this.style.display='none'">
    <span class="logo-text">E.M.E.P</span>
  </div>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="index.html#schools">Schools</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="Contact.html">Contact</a></li>
    <li><a href="signin.html">Sign In</a></li>
  </ul>

  <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-menu" id="mobileMenu" aria-hidden="true">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="index.html#schools">Schools</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="Contact.html">Contact</a></li>
    <li><a href="signin.html">Sign In</a></li>
  </ul>
</div>

<!-- ====== SIGN UP WRAPPER ====== -->
<div class="signin-wrapper">
  <div class="signin-card" style="max-width: 460px;">
    <img src="./img/logo.png" alt="E.M.E.P Logo" class="brand-logo" onerror="this.style.display='none'">
    <div class="brand-name">E.M.E.P</div>
    <p class="subtitle">Create your portal account</p>

    <form id="signup-form" novalidate>

      <!-- Row: Full name + Phone side by side on wider screens -->
      <div class="form-row">
        <div class="input-group">
          <label for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" placeholder="e.g. Ahmed Ezz" required autocomplete="name">
        </div>
        <div class="input-group">
          <label for="user_phone">Phone Number</label>
          <input type="tel" id="user_phone" name="user_phone" placeholder="01XXXXXXXXX" required autocomplete="tel">
        </div>
      </div>

      <div class="input-group">
        <label for="user_name">Username</label>
        <input type="text" id="user_name" name="user_name" placeholder="e.g. EMEP_Ahmed" required autocomplete="username">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="input-eye-wrap">
          <input type="password" id="password" name="password" placeholder="Min. 8 characters" required autocomplete="new-password">
          <button type="button" class="eye-btn" aria-label="Toggle password visibility" data-target="password">
            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="password-strength" id="pwd-strength" aria-live="polite"></div>
      </div>

      <div class="input-group">
        <label for="confirm_password">Confirm Password</label>
        <div class="input-eye-wrap">
          <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required autocomplete="new-password">
          <button type="button" class="eye-btn" aria-label="Toggle confirm password visibility" data-target="confirm_password">
            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="match-hint" id="match-hint" aria-live="polite"></div>
      </div>

      <div id="signup-error" class="status-msg" role="alert" aria-live="polite"></div>

      <button type="submit" class="btn-primary" style="border:none; margin-top:4px;">Create Account</button>
    </form>

    <div class="divider">or</div>

    <div class="footer-links">
      Already have an account? <a href="signin.html">Sign in</a>
    </div>
    <div class="footer-links" style="margin-top:10px;">
      Have a question? <a href="Contact.html">Contact Support</a>
    </div>
  </div>
</div>

<!-- Inline styles only for signup-specific additions -->
<style>
  /* Two-column row on wider cards */
  .form-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
  }
  @media (min-width: 420px) {
    .form-row {
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }
  }

  /* Input + eye button wrapper */
  .input-eye-wrap {
    position: relative;
  }
  .input-eye-wrap input {
    padding-right: 48px;
  }
  .eye-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    color: var(--muted);
    display: flex;
    align-items: center;
    transition: color var(--transition);
  }
  .eye-btn:hover { color: var(--gold); }
  .eye-icon { width: 18px; height: 18px; }

  /* Password strength bar */
  .password-strength {
    margin-top: 8px;
    height: 4px;
    border-radius: 4px;
    background: rgba(201,168,124,0.15);
    overflow: hidden;
    position: relative;
    transition: all 0.4s ease;
  }
  .password-strength::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    border-radius: 4px;
    width: var(--strength-w, 0%);
    background: var(--strength-color, transparent);
    transition: width 0.4s ease, background 0.4s ease;
  }
  .strength-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 5px;
    color: var(--strength-color, var(--muted));
    display: block;
  }

  /* Match hint */
  .match-hint {
    font-size: 0.75rem;
    font-weight: 500;
    margin-top: 6px;
    min-height: 16px;
    transition: color 0.3s ease;
  }
  .match-hint.ok  { color: #3a7a46; }
  .match-hint.bad { color: #b33; }
</style>

<script>
  /* --- Navbar scroll --- */
  const navbar = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 30);
  }, { passive: true });

  /* --- Hamburger --- */
  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    const open = hamburger.classList.toggle('open');
    mobileMenu.classList.toggle('open', open);
    hamburger.setAttribute('aria-expanded', open);
    mobileMenu.setAttribute('aria-hidden', !open);
    document.body.style.overflow = open ? 'hidden' : '';
  });
  mobileMenu.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      hamburger.classList.remove('open');
      mobileMenu.classList.remove('open');
      hamburger.setAttribute('aria-expanded', false);
      mobileMenu.setAttribute('aria-hidden', true);
      document.body.style.overflow = '';
    });
  });

  /* --- Show/Hide password toggle --- */
  document.querySelectorAll('.eye-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      // Swap icon opacity as visual cue
      btn.style.opacity = isText ? '1' : '0.5';
    });
  });

  /* --- Password strength meter --- */
  const pwdInput     = document.getElementById('password');
  const strengthBar  = document.getElementById('pwd-strength');

  pwdInput.addEventListener('input', () => {
    const val = pwdInput.value;
    let score = 0;
    if (val.length >= 8)                     score++;
    if (/[A-Z]/.test(val))                   score++;
    if (/[0-9]/.test(val))                   score++;
    if (/[^A-Za-z0-9]/.test(val))            score++;

    const levels = [
      { w: '0%',   color: 'transparent',  label: '' },
      { w: '30%',  color: '#e05c5c',      label: 'Weak' },
      { w: '60%',  color: '#e0a030',      label: 'Fair' },
      { w: '80%',  color: '#6ab04c',      label: 'Good' },
      { w: '100%', color: '#3a7a46',      label: 'Strong' },
    ];

    const lvl = val.length === 0 ? levels[0] : levels[score] || levels[1];
    strengthBar.style.setProperty('--strength-w', lvl.w);
    strengthBar.style.setProperty('--strength-color', lvl.color);

    // Remove old label
    const old = strengthBar.nextElementSibling;
    if (old && old.classList.contains('strength-label')) old.remove();

    if (val.length > 0) {
      const lbl = document.createElement('span');
      lbl.className = 'strength-label';
      lbl.style.color = lvl.color;
      lbl.textContent = lvl.label;
      strengthBar.insertAdjacentElement('afterend', lbl);
    }

    checkMatch();
  });

  /* --- Password match hint --- */
  const confirmInput = document.getElementById('confirm_password');
  const matchHint    = document.getElementById('match-hint');

  function checkMatch() {
    if (!confirmInput.value) { matchHint.textContent = ''; matchHint.className = 'match-hint'; return; }
    if (pwdInput.value === confirmInput.value) {
      matchHint.textContent = '✓ Passwords match';
      matchHint.className = 'match-hint ok';
    } else {
      matchHint.textContent = '✗ Passwords do not match';
      matchHint.className = 'match-hint bad';
    }
  }
  confirmInput.addEventListener('input', checkMatch);

  /* --- Form submit --- */
  document.getElementById('signup-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const errEl = document.getElementById('signup-error');

    if (pwdInput.value !== confirmInput.value) {
      errEl.textContent = '✗ Passwords do not match. Please try again.';
      errEl.className = 'status-msg error';
      confirmInput.focus();
      return;
    }
    if (pwdInput.value.length < 8) {
      errEl.textContent = '✗ Password must be at least 8 characters.';
      errEl.className = 'status-msg error';
      pwdInput.focus();
      return;
    }

    errEl.className = 'status-msg';
    // Hook up your registration logic here
    errEl.textContent = 'Registration portal coming soon. Contact support for access.';
    errEl.className = 'status-msg success';
  });
</script>
</body>
</html>
