<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | E.M.E.P</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ====== NAVBAR ====== -->
<nav class="navbar" id="navbar">
  <div class="nav-left">
    <img src="./img/logo.png" alt="E.M.E.P Logo" class="nav-logo" onerror="this.style.display='none'">
    <span class="logo-text">E.M.E.P</span>
  </div>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="index.html#schools">Schools</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="Contact.html">Contact</a></li>
    <li><a href="signin.html" class="active">Sign In</a></li>
  </ul>

  <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-menu" id="mobileMenu" aria-hidden="true">
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="index.html#schools">Schools</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="Contact.html">Contact</a></li>
    <li><a href="signin.html" class="active">Sign In</a></li>
  </ul>
</div>

<!-- ====== SIGN IN WRAPPER ====== -->
<div class="signin-wrapper">
  <div class="signin-card">
    <img src="./img/logo.png" alt="E.M.E.P Logo" class="brand-logo" onerror="this.style.display='none'">
    <div class="brand-name">E.M.E.P</div>
    <p class="subtitle">Sign in to access your portal</p>

    <form id="signin-form" novalidate>
      <div class="input-group">
        <label for="user_name">Username</label>
        <input type="text" id="user_name" name="user_name" placeholder="e.g. EMEP" required autocomplete="username">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div id="signin-error" class="status-msg" role="alert" aria-live="polite"></div>

      <button type="submit" class="btn-primary" style="border:none;">Sign In</button>
    </form>

    <div class="footer-links">
      Don't have an account? <a href="signup.html">Sign up</a>
    </div>
  </div>
</div>

<script>
  /* --- Navbar scroll --- */
  const navbar = document.getElementById('navbar');
  window.addEventListener('scroll', () => {
    navbar.classList.toggle('scrolled', window.scrollY > 30);
  }, { passive: true });

  /* --- Hamburger --- */
  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    const open = hamburger.classList.toggle('open');
    mobileMenu.classList.toggle('open', open);
    hamburger.setAttribute('aria-expanded', open);
    mobileMenu.setAttribute('aria-hidden', !open);
    document.body.style.overflow = open ? 'hidden' : '';
  });
  mobileMenu.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      hamburger.classList.remove('open');
      mobileMenu.classList.remove('open');
      hamburger.setAttribute('aria-expanded', false);
      mobileMenu.setAttribute('aria-hidden', true);
      document.body.style.overflow = '';
    });
  });

  /* --- Form submit placeholder --- */
  document.getElementById('signin-form').addEventListener('submit', function(e) {
    e.preventDefault();
    // Hook up your authentication logic here
    const errEl = document.getElementById('signin-error');
    errEl.textContent = 'This portal is not yet connected. Please check back later.';
    errEl.className = 'status-msg error';
  });
</script>
</body>
</html>
